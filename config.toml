# TradingBotty settings. Secrets (API keys) go in .env, never here.

[money]
starting_cash_usd = 100.0      # paper and live starting stake
quote_currency = "USD"

[ai_budget]
# Hard total the bot may ever spend on AI tokens. When it's gone, agents fall back to free math-only mode.
total_usd = 20.0
# Spread the budget over this many days by default...
spread_over_days = 30
# ...but the daily allowance grows with profit: this share of realized profit is added to the budget.
reinvest_profit_share = 0.10
fast_model = "claude-haiku-4-5"
deep_model = "claude-opus-5-5"

[risk]
# Hard limits enforced in plain code by the Risk Officer. The Optimizer can never change these.
# Limits are percentages of current equity so they grow with the account (compounding).
max_position_pct = 25.0        # no single position bigger than this share of equity
max_open_positions = 5
max_daily_loss_pct = 30.0      # after this loss within 24h: no new buys until the next day (sells still allowed)
min_order_usd = 1.0            # Bitpanda's minimum is about 1 EUR
min_cash_reserve_usd = 0.5
# Spot only. These are informational: there is no code path for margin, leverage or shorting.
allow_margin = false
allow_short = false

[paper]
fee_pct = 1.5                  # cost per side, percent. Matches Bitpanda app quotes so paper results are honest. Lower to ~0.1 once live trading moves to Bitpanda Fusion.
slippage_pct = 0.05

[live]
broker = "bitpanda"
currency = "EUR"               # the fiat wallet the bot trades from on Bitpanda (EUR or CHF)
# Live mirrors the champion strategy: if the champion puts 20% of its equity into SOL, live does the same with live money.
# Live trading also needs BITPANDA_API_KEY in .env and the switch in the dashboard.
fee_pct = 1.5                  # assumed cost per side on Bitpanda app quotes; check your own

[markets]
crypto = ["BTC", "ETH", "SOL", "XRP", "DOGE", "ADA", "AVAX", "LINK", "DOT", "PEPE"]
stocks = ["SPY", "QQQ", "NVDA", "TSLA", "AAPL", "MSFT", "AMD", "COIN"]

[engine]
tick_seconds = 15              # how often the agent pipeline runs
price_poll_seconds = 5
stock_poll_seconds = 60
hype_poll_seconds = 300
news_poll_seconds = 300
professor_every_minutes = 180  # deep-model review, only if budget allows
